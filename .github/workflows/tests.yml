name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # requirements.lock is resolved for CPython 3.11 / Linux x86_64
          cache: pip
          cache-dependency-path: requirements.lock

      # Install the pinned lock exactly. torch, triton and the nvidia-* CUDA
      # wheels are skipped: no test imports them and they are several GB.
      # --no-deps keeps pip from pulling them back in via accelerate/peft;
      # the lock already lists every other transitive dependency.
      - name: Install pinned dependencies (without torch/CUDA)
        run: |
          grep -vE '^(torch|triton|nvidia-)' requirements.lock > ci-requirements.txt
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r ci-requirements.txt

      - name: Run tests
        run: python -m pytest -q
